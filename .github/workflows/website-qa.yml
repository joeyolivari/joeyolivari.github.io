name: Website visual QA
on:
  push:
    branches: [main, social-preview-instagram-2026]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Test mobile, desktop, navigation and bilingual flows
        run: npx playwright test --config=playwright.config.cjs
      - name: Save failure screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-qa-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
