name: Build Instagram social preview
on:
  push:
    branches: [social-preview-instagram-2026]
    paths:
      - tools/generate-social-preview.py
      - .github/workflows/build-social-preview.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install Pillow==11.2.1
      - name: Render crop-safe Open Graph image
        run: python tools/generate-social-preview.py
      - name: Commit rendered image to staging
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/social-portfolio-2026.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Render optimized 1200x630 Instagram sharing image"
            git push origin HEAD:social-preview-instagram-2026
          fi
